name: Security and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Windows_and_Linux/requirements-ci-lock.txt

      - name: Install audited dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install --require-hashes -r Windows_and_Linux/requirements-ci-lock.txt

      - name: Scan Git history for secrets
        run: python scripts/security_check.py --history

      - name: Audit Python dependencies
        run: python -m pip_audit -r Windows_and_Linux/requirements-lock.txt --progress-spinner off

      - name: Run static security analysis
        run: python -m bandit -r Windows_and_Linux -x Windows_and_Linux/tests

      - name: Run tests
        working-directory: Windows_and_Linux
        run: python -m unittest discover -s tests -v
